spring:
  cloud:
    gateway:
      routes:
        - id: city-service
          uri: https://city-service.internal.${CONTAINER_APP_ENV_DNS_SUFFIX}
          predicates:
            - Path=/city-service/**
          filters:
            - StripPrefix=1
        - id: weather-service
          uri: https://weather-service.internal.${CONTAINER_APP_ENV_DNS_SUFFIX}
          predicates:
            - Path=/weather-service/**
          filters:
            - StripPrefix=1
      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOrigins: "*"
            allowedMethods:
              - GET
